version: 2

unit_tests:
  - name: stg_customers_renames_id_and_passes_through_names
    description: raw_customers.id is exposed as customer_id; first_name and last_name are passed through; every source row is kept.
    model: stg_customers
    given:
      - input: ref('raw_customers')
        rows:
          - {id: 1, first_name: Michael, last_name: P.}
          - {id: 2, first_name: Shawn, last_name: M.}
          - {id: 3, first_name: Kathleen, last_name: P.}
    expect:
      rows:
        - {customer_id: 1, first_name: Michael, last_name: P.}
        - {customer_id: 2, first_name: Shawn, last_name: M.}
        - {customer_id: 3, first_name: Kathleen, last_name: P.}

  - name: stg_customers_keeps_rows_with_null_names
    description: The model does not filter or default missing names; nulls flow through (the not_null data tests catch them).
    model: stg_customers
    given:
      - input: ref('raw_customers')
        rows:
          - {id: 10, first_name: null, last_name: R.}
          - {id: 11, first_name: Anna, last_name: null}
    expect:
      rows:
        - {customer_id: 10, first_name: null, last_name: R.}
        - {customer_id: 11, first_name: Anna, last_name: null}

  - name: stg_customers_does_not_clean_name_values
    description: Names are not trimmed or re-cased; values reach downstream exactly as in the source.
    model: stg_customers
    given:
      - input: ref('raw_customers')
        rows:
          - {id: 20, first_name: " mary ", last_name: "o'B."}
    expect:
      rows:
        - {customer_id: 20, first_name: " mary ", last_name: "o'B."}
