version: 2

unit_tests:
  - name: test_orders_pivots_mixed_payment_methods
    description: >
      An order paid with several different methods gets one *_amount column per
      method (0 for unused methods) and `amount` equals the sum of all payments.
    model: orders
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: 10, order_date: '2018-01-01', status: completed}
      - input: ref('stg_payments')
        rows:
          - {payment_id: 1, order_id: 1, payment_method: credit_card, amount: 10.0}
          - {payment_id: 2, order_id: 1, payment_method: coupon, amount: 5.0}
          - {payment_id: 3, order_id: 1, payment_method: gift_card, amount: 2.5}
    expect:
      rows:
        - {order_id: 1, customer_id: 10, order_date: '2018-01-01', status: completed,
           credit_card_amount: 10.0, coupon_amount: 5.0, bank_transfer_amount: 0.0,
           gift_card_amount: 2.5, amount: 17.5}

  - name: test_orders_sums_multiple_payments_of_same_method
    description: >
      Multiple payments with the same method on one order are summed into that
      method's column; zero-amount payments contribute 0. Orders are not mixed up.
    model: orders
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: 10, order_date: '2018-01-01', status: placed}
          - {order_id: 2, customer_id: 11, order_date: '2018-01-02', status: shipped}
      - input: ref('stg_payments')
        rows:
          - {payment_id: 1, order_id: 1, payment_method: bank_transfer, amount: 7.0}
          - {payment_id: 2, order_id: 1, payment_method: bank_transfer, amount: 3.0}
          - {payment_id: 3, order_id: 1, payment_method: bank_transfer, amount: 0.0}
          - {payment_id: 4, order_id: 2, payment_method: coupon, amount: 0.0}
    expect:
      rows:
        - {order_id: 1, customer_id: 10, order_date: '2018-01-01', status: placed,
           credit_card_amount: 0.0, coupon_amount: 0.0, bank_transfer_amount: 10.0,
           gift_card_amount: 0.0, amount: 10.0}
        - {order_id: 2, customer_id: 11, order_date: '2018-01-02', status: shipped,
           credit_card_amount: 0.0, coupon_amount: 0.0, bank_transfer_amount: 0.0,
           gift_card_amount: 0.0, amount: 0.0}

  - name: test_orders_without_payments_have_null_amounts
    description: >
      Documents current behaviour: orders are left-joined to payments, so an order
      with no payments is kept but all *_amount columns and `amount` are NULL
      (not 0). The not_null tests on those columns would fail if this occurred.
    model: orders
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: 10, order_date: '2018-01-01', status: placed}
          - {order_id: 2, customer_id: 11, order_date: '2018-01-02', status: placed}
      - input: ref('stg_payments')
        rows:
          - {payment_id: 1, order_id: 1, payment_method: credit_card, amount: 4.0}
    expect:
      rows:
        - {order_id: 1, customer_id: 10, order_date: '2018-01-01', status: placed,
           credit_card_amount: 4.0, coupon_amount: 0.0, bank_transfer_amount: 0.0,
           gift_card_amount: 0.0, amount: 4.0}
        - {order_id: 2, customer_id: 11, order_date: '2018-01-02', status: placed,
           credit_card_amount: null, coupon_amount: null, bank_transfer_amount: null,
           gift_card_amount: null, amount: null}

  - name: test_orders_unknown_payment_method_only_counts_in_amount
    description: >
      Documents current behaviour: the pivot list is hard-coded, so a payment
      method outside it (e.g. 'paypal') is included in `amount` but in no
      *_amount column. The singular test orders__payment_method_amounts_sum_to_amount
      would catch this in real data.
    model: orders
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: 10, order_date: '2018-01-01', status: completed}
      - input: ref('stg_payments')
        rows:
          - {payment_id: 1, order_id: 1, payment_method: credit_card, amount: 6.0}
          - {payment_id: 2, order_id: 1, payment_method: paypal, amount: 4.0}
    expect:
      rows:
        - {order_id: 1, customer_id: 10, order_date: '2018-01-01', status: completed,
           credit_card_amount: 6.0, coupon_amount: 0.0, bank_transfer_amount: 0.0,
           gift_card_amount: 0.0, amount: 10.0}
